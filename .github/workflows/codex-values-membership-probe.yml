name: cachetools old candidate focused membership observation
on:
  workflow_dispatch:
  push:
    branches: [codex/observe-cachetools-values-membership]
permissions:
  contents: read
jobs:
  native-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tkem/cachetools
          ref: 1ce79efa552d1bdda70d144d401ef9105d999184
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          allow-prereleases: true
      - name: Freeze exact original, old candidate, membership probe and replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYASSETS'
          from pathlib import Path
          import base64,json,os,zlib
          root=Path(os.environ['RUNNER_TEMP'])/'cache-review69'
          root.mkdir()
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          for name,value in assets.items():(root/name).write_text(value)
          PYASSETS
          python "$RUNNER_TEMP/cache-review69/guard.py" before
      - name: Build official original tox environment and record all baseline outcomes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir tox
          tox -e py --notest
          python "$RUNNER_TEMP/cache-review69/guard.py" baseline-built
          tox exec -e py -- python "$RUNNER_TEMP/cache-review69/phase.py" baseline
          python "$RUNNER_TEMP/cache-review69/guard.py" baseline-recorded
      - name: Apply the preserved old exact four-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/cache-review69/candidate.patch"
          git apply "$RUNNER_TEMP/cache-review69/candidate.patch"
          python "$RUNNER_TEMP/cache-review69/guard.py" after-apply
      - name: Recreate official candidate tox environment and record all candidate outcomes
        shell: bash
        run: |
          set -euo pipefail
          tox -r -e py --notest
          python "$RUNNER_TEMP/cache-review69/guard.py" candidate-built
          tox exec -e py -- python "$RUNNER_TEMP/cache-review69/phase.py" candidate
          python "$RUNNER_TEMP/cache-review69/guard.py" candidate-recorded
      - name: Assess complete recorded evidence without requiring product outcome counts
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/cache-review69/assess.py"
          python "$RUNNER_TEMP/cache-review69/guard.py" after-assessment
      - name: Verify final source, index, tree, fixtures and declared patch
        if: always()
        shell: bash
        run: python "$RUNNER_TEMP/cache-review69/guard.py" final
