name: cachetools repaired candidate native verification
on:
  workflow_dispatch:
  push:
    branches: [codex/verify-suspended-iterator-candidate]
permissions:
  contents: read
jobs:
  native:
    name: Python ${{ matrix.python }} candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t", "3.15", "3.15t", "pypy3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tkem/cachetools
          ref: 1ce79efa552d1bdda70d144d401ef9105d999184
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Freeze exact source, candidate, both unchanged probes and replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYASSETS'
          from pathlib import Path
          import base64,json,os,zlib
          root=Path(os.environ['RUNNER_TEMP'])/'cache-candidate'
          root.mkdir()
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          for name,value in assets.items():(root/name).write_text(value)
          PYASSETS
          python "$RUNNER_TEMP/cache-candidate/guard.py" before
      - name: Run official baseline and record both public probes and normal replay
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir tox
          tox -e py -- tests/test_ttl.py tests/test_tlru.py -q
          tox exec -e py -- python "$RUNNER_TEMP/cache-candidate/native-phase.py" before
          python "$RUNNER_TEMP/cache-candidate/guard.py" before-recorded
      - name: Apply only the exact repaired candidate patch to the upstream pin
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/cache-candidate/candidate.patch"
          git apply "$RUNNER_TEMP/cache-candidate/candidate.patch"
          python "$RUNNER_TEMP/cache-candidate/guard.py" after-apply
      - name: Run and record every native tox gate before source publication
        shell: bash
        run: |
          set -euo pipefail
          set +e
          tox -r -p auto
          tox_status=$?
          set -e
          printf '%s\n' "$tox_status" > "$RUNNER_TEMP/cache-candidate/tox-status.txt"
          python "$RUNNER_TEMP/cache-candidate/guard.py" after-tox
      - name: Record candidate results for both unchanged eight-case probes and replay
        shell: bash
        run: |
          set -euo pipefail
          tox exec -e py -- python "$RUNNER_TEMP/cache-candidate/native-phase.py" candidate
          python "$RUNNER_TEMP/cache-candidate/guard.py" candidate-recorded
      - name: Require both repaired probes green, normal replay equal and every tox gate passed
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/cache-candidate/native-assess.py"
          python "$RUNNER_TEMP/cache-candidate/guard.py" after-assessment
      - name: Verify final complete source, frozen probes and declared candidate
        if: always()
        shell: bash
        run: python "$RUNNER_TEMP/cache-candidate/guard.py" final
