name: cachetools suspended iterator native diagnosis
on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-suspended-iterator-time]
permissions:
  contents: read
jobs:
  native-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tkem/cachetools
          ref: 1ce79efa552d1bdda70d144d401ef9105d999184
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Freeze public diagnostic and exact full source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYASSETS'
          from pathlib import Path
          import base64,json,zlib,os
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          for name,value in assets.items():Path(os.environ['RUNNER_TEMP'],'cache-'+name+'.py').write_text(value)
          PYASSETS
          python "$RUNNER_TEMP/cache-guard.py" before
      - name: Install official tox runner and run existing timed-cache baseline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir tox
          tox -e py -- tests/test_ttl.py tests/test_tlru.py -q
          python "$RUNNER_TEMP/cache-guard.py" after-baseline
      - name: Execute exact finite public fixture in native tox environment
        shell: bash
        run: |
          set -euo pipefail
          tox exec -e py -- python "$RUNNER_TEMP/cache-runner.py"
          python "$RUNNER_TEMP/cache-guard.py" after-fixture
      - name: Verify complete unchanged source and frozen fixture
        if: always()
        shell: bash
        run: python "$RUNNER_TEMP/cache-guard.py" final
